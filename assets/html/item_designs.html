<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تصاميم العناصر</title>
    <link rel="stylesheet" href="../css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Custom styles for image rendering */
        .grid-image {
            max-width: 60px;
            max-height: 60px;
            border-radius: 8px;
            object-fit: cover;
            cursor: pointer;
            border: 1px solid #e5e7eb;
            transition: transform 0.2s;
        }
        .grid-image:hover {
            transform: scale(1.1);
            border-color: #3b82f6;
        }
        .element-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f3f4f6;
            padding: 4px 8px;
            border-radius: 6px;
            margin: 2px;
            border: 1px solid #e5e7eb;
        }
        .element-color {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
        }
    </style>
</head>

<body class="bg-gray-100 p-8">
    <div class="max-w-[1800px] mx-auto">
        <div class="mb-4 flex flex-col sm:flex-row sm:justify-between items-center gap-3">
            <div class="space-x-3">
                <a id="backToInvoiceItemsLink" href="#"
                    class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 inline-block">رجوع لعناصر الفاتورة</a>
                <a href="asset_types.html"
                    class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 inline-block">إدارة Asset Types</a>
                <a href="invoices.html"
                    class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 inline-block">الفواتير</a>
                <a href="../../index.html"
                    class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 inline-block">الرئيسية</a>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 mb-6" dir="rtl">
            <div class="flex flex-col md:flex-row justify-between gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">تصاميم العناصر</h1>
                    <p class="mt-3 text-gray-600">رقم الفاتورة: <span id="invoiceNumberDisplay"
                            class="font-semibold text-gray-900">---</span></p>
                    <p class="mt-2 text-gray-600">Customer ID: <span id="invoiceCustomerDisplay"
                            class="font-semibold text-gray-900">---</span> <span id="invoiceCustomerNameDisplay"
                            class="font-semibold text-gray-900">---</span></p>
                </div>
                <div class="text-right">
                    <p class="text-sm text-gray-500">Invoice ID داخلي: <span id="invoiceIdDisplay"
                            class="font-semibold">---</span></p>
                </div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="mb-4 flex justify-start select-none items-center gap-3" dir="ltr">
            <button type="button" onclick="addNewRowToDatabase()"
                class="flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold bg-blue-600 hover:bg-blue-700 text-white transition-all duration-200 shadow-sm active:scale-95 select-none mr-auto">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span>إضافة سطر جديد</span>
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-2" dir="rtl">
            <div id="designsGrid" class="w-full h-[600px] overflow-hidden rounded-lg custom-scrollbar"></div>
        </div>
    </div>

    <!-- Image Preview Modal -->
    <div id="imagePreviewModal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-[9999] p-4">
        <div class="relative bg-transparent rounded-xl max-w-4xl w-full">
            <button type="button" onclick="closeImageModal()" class="absolute top-4 left-4 bg-white rounded-full p-2 shadow-md text-gray-700 hover:bg-gray-100 z-10 w-10 h-10 flex items-center justify-center font-bold text-xl leading-none">X</button>
            <img id="modalPreviewImage" src="" alt="معاينة الصورة الكبيرة" class="w-full h-auto rounded-xl shadow-2xl object-contain max-h-[90vh] mx-auto">
        </div>
    </div>

    <!-- Manage Elements Modal -->
    <div id="manageElementsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-xl relative border border-gray-100 text-right dir-rtl">
            <!-- Close Button -->
            <button type="button" onclick="closeManageElementsModal()"
                class="absolute top-4 left-4 text-gray-400 hover:text-gray-600 transition w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 z-10">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <h3 id="manageElementsModalTitle" class="text-xl font-bold text-gray-800 text-center mb-6">إضافة عنصر للتصميم</h3>

            <form id="addElementForm" class="space-y-4 text-right">
                <input type="hidden" id="currentDesignAssetId" value="">
                <input type="hidden" id="currentEditElementId" value="">
                
                <!-- نوع العنصر -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">نوع العنصر <span class="text-red-500">*</span></label>
                    <select id="elementAssetTypeId" required
                        class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none text-right bg-white">
                        <option value="">اختر نوع العنصر...</option>
                    </select>
                </div>

                <!-- ترتيب التصميم (مخفي، يُحسب تلقائياً) -->
                <input type="hidden" id="elementDisplayOrder" value="1">

                <div class="grid grid-cols-2 gap-4">
                    <!-- الصورة -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">صورة العنصر (إن وجد)</label>
                        <input type="file" id="elementImage" accept="image/*"
                            class="w-full text-xs text-gray-500 file:ml-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                        <!-- Image Preview Box -->
                        <div id="elementImagePreviewContainer" class="mt-2 hidden">
                            <p class="text-[10px] text-gray-400 mb-1">الصورة الحالية:</p>
                            <img id="elementImagePreview" src="" class="w-16 h-16 rounded-lg object-cover border border-gray-200 shadow-sm" />
                        </div>
                    </div>
                    <!-- اللون -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">لون العنصر (إن وجد)</label>
                        <input type="color" id="elementColor" value="#000000"
                            class="w-full h-[46px] p-1 border border-gray-300 rounded-xl cursor-pointer">
                        <!-- Checkbox to decide if we use color -->
                        <div class="mt-1 flex items-center gap-2">
                            <input type="checkbox" id="useElementColor" class="w-4 h-4 text-blue-600 rounded border-gray-300">
                            <label for="useElementColor" class="text-xs text-gray-500">تضمين اللون في الحفظ</label>
                        </div>
                    </div>
                </div>

                <!-- المواصفات -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">المواصفات الفنية / ملاحظات</label>
                    <textarea id="elementSpecs" rows="2" placeholder="أدخل تفاصيل إضافية..."
                        class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none text-right resize-y"></textarea>
                </div>

                <!-- حالة الموافقة -->
                <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-xl border border-gray-100">
                    <input type="checkbox" id="elementIsApproved" checked class="w-5 h-5 text-green-600 rounded border-gray-300 focus:ring-green-500 cursor-pointer">
                    <label for="elementIsApproved" class="text-sm font-semibold text-gray-700 cursor-pointer select-none">العنصر موافق عليه (سيظهر في الجدول)</label>
                </div>

                <!-- أزرار الحفظ والإغلاق -->
                <div class="flex justify-end gap-3 border-t pt-4 mt-4">
                    <button type="button" onclick="closeManageElementsModal()"
                        class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold px-6 py-3 rounded-xl transition duration-150 select-none">
                        إلغاء
                    </button>
                    <button type="submit" id="submitAddElementBtn"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3 rounded-xl transition duration-150 shadow-md shadow-blue-100 hover:shadow-lg active:scale-95 flex items-center gap-2 select-none">
                        <svg id="submitElementSpinner" class="hidden animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span>حفظ العنصر</span>
                    </button>
                </div>
            </form>
        </div>
    </div>


    <script src="../js/App.js"></script>
    <script src="../js/item_designs.js"></script>
</body>
</html>
