<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سجل تصاميم المنتج</title>
    <link rel="stylesheet" href="../css/tailwind.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .drag-scroll { cursor: grab; }
        .drag-scroll:active { cursor: grabbing; }
    </style>
</head>
<body class="bg-gray-100 font-cairo min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 shrink-0 relative z-10 sticky top-0">
        <div class="max-w-screen-2xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                سجل تصاميم المنتج: <span id="historyProductName" class="text-blue-600 font-extrabold ml-2">---</span>
            </h1>
            <a href="javascript:history.back()" class="bg-gray-600 text-white px-5 py-2 rounded-lg hover:bg-gray-700 transition font-bold shadow-sm">رجوع للإدارة</a>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col bg-gray-50 relative">
        <!-- Top Image -->
        <div id="topProductImageContainer" class="flex justify-center p-4 shrink-0 bg-white shadow-sm z-0 border-b border-gray-200">
            <!-- Top image injected here -->
        </div>


        
        <!-- Kanban Columns Container -->
        <div id="productDesignsContainer" class="flex gap-5 overflow-x-auto p-6 custom-scrollbar items-start drag-scroll flex-1">
            <div class="text-center text-gray-500 font-bold w-full mt-10 text-xl">جاري التحميل...</div>
        </div>
    </main>

    <!-- Image Preview Modal -->
    <div id="imagePreviewModal" class="hidden fixed inset-0 bg-black bg-opacity-75 z-50 flex items-center justify-center p-4">
        <div class="relative max-w-4xl w-full">
            <button onclick="closeImageModal()" class="absolute -top-10 right-0 text-white hover:text-gray-300">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <img id="previewImage" src="" class="w-full h-auto max-h-[85vh] object-contain rounded-lg">
        </div>
    </div>

    <!-- Manage Element Modal -->
    <div id="manageElementsModal" class="hidden fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-hidden flex flex-col relative text-right dir-rtl">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <button type="button" onclick="closeManageElementsModal()"
                    class="text-gray-400 hover:text-red-500 transition w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <h3 id="manageElementsModalTitle" class="text-xl font-bold text-gray-800">تعديل العنصر</h3>
            </div>
            
            <form id="addElementForm" class="p-6 flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-6">
                <input type="hidden" id="currentDesignAssetId">
                <input type="hidden" id="currentEditElementId">
                
                <div class="space-y-2">
                    <label class="block text-sm font-bold text-gray-700">نوع العنصر <span class="text-red-500">*</span></label>
                    <select id="elementAssetTypeId" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white shadow-sm">
                        <!-- Loaded dynamically -->
                    </select>
                </div>

                <!-- ترتيب التصميم (مخفي، يُحسب تلقائياً) -->
                <input type="hidden" id="elementDisplayOrder" value="1">

                <div class="space-y-3">
                    <label class="block text-sm font-bold text-gray-700">صورة العنصر المرجعية</label>
                    <div class="flex items-center justify-center w-full">
                        <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 transition hover:border-blue-400 group">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <svg class="w-8 h-8 mb-3 text-gray-400 group-hover:text-blue-500 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                <p class="mb-1 text-sm text-gray-500"><span class="font-bold">اضغط لرفع صورة جديدة</span></p>
                            </div>
                            <input type="file" id="elementImage" accept="image/*" class="hidden" />
                        </label>
                    </div>
                    <div id="elementImagePreviewContainer" class="hidden mt-3 w-full flex justify-center">
                        <img id="elementImagePreview" class="h-32 object-contain rounded-lg border border-gray-200 shadow-sm" />
                    </div>
                </div>

                <div class="space-y-3 bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <div class="flex items-center justify-between">
                        <label class="text-sm font-bold text-gray-700">تحديد لون خاص (HEX)</label>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="useElementColor" class="sr-only peer" onchange="document.getElementById('colorInputContainer').classList.toggle('hidden', !this.checked)">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>
                    <div id="colorInputContainer" class="hidden flex gap-3 items-center">
                        <input type="color" id="elementColor" class="w-12 h-12 p-1 rounded-lg border border-gray-200 cursor-pointer shadow-sm">
                        <span class="text-xs text-gray-500">انقر لاختيار اللون</span>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-bold text-gray-700">ملاحظات / مواصفات فنية إضافية</label>
                    <textarea id="elementSpecs" rows="3" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition shadow-sm resize-none custom-scrollbar" placeholder="اكتب أي ملاحظات هنا..."></textarea>
                </div>
                
                <div class="space-y-3 bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <div class="flex items-center justify-between">
                        <label class="text-sm font-bold text-blue-900">الاعتماد والموافقة</label>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="elementIsApproved" class="sr-only peer">
                            <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-300 rounded-full peer peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div>
                        </label>
                    </div>
                    <p class="text-xs text-blue-700">تفعيل هذا الخيار يعني أن العنصر معتمد.</p>
                </div>

                <div class="pt-4 border-t border-gray-100">
                    <button type="submit" id="submitAddElementBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                        <span id="submitElementSpinner" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                        حفظ التعديلات
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/App.js"></script>
    <script src="../js/product_history.js"></script>
</body>
</html>
