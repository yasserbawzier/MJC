<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>إدارة المنتجات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="App.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto">
        <div class="mb-4">
            <a href="index.html"
                class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 inline-block">العودة إلى
                الرئيسية</a>
        </div>
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">إدارة المنتجات</h1>
                <p class="text-gray-600 mt-2">أضف منتجاً واختر نوعه مباشرة من نفس الصفحة.</p>
            </div>
            <div class="flex flex-wrap gap-3">
                <button onclick="showAddProductTypeModal()"
                    class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700">إضافة نوع منتج</button>
                <a href="product_types.html"
                    class="bg-gray-200 text-gray-800 px-6 py-2 rounded-lg hover:bg-gray-300">عرض أنواع المنتجات</a>
            </div>
        </header>

        <div class="bg-white rounded-xl shadow-lg p-4 mb-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">بحث باسم المنتج</label>
                    <input id="productSearchInput" type="text" placeholder="ابحث عن منتج"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">فلترة بحسب النوع</label>
                    <select id="productTypeFilter"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none"></select>
                </div>
                <div class="hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-1">فلترة بحسب الحالة</label>
                    <select id="productStatusFilter"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="all">كل المنتجات</option>
                        <option value="hasType">يوجد نوع</option>
                        <option value="noType">بدون نوع</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg table-wrapper">
            <table class="min-w-max w-full text-left whitespace-nowrap" dir="ltr">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="p-4 text-gray-600 font-bold">Product Custom ID</th>
                        <th class="p-4 text-gray-600 font-bold">Product Name</th>
                        <th class="p-4 text-gray-600 font-bold">Image</th>
                        <th class="p-4 text-gray-600 font-bold">Specifications</th>
                        <th class="p-4 text-gray-600 font-bold">Sample Details</th>
                        <th class="p-4 text-gray-600 font-bold">MOQ</th>
                        <th class="p-4 text-gray-600 font-bold">Days of Manufacturing</th>
                        <th class="p-4 text-gray-600 font-bold">Video URL</th>
                        <th class="p-4 text-gray-600 font-bold">Type</th>
                        <th class="p-4 text-gray-600 font-bold text-left">Actions</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody"></tbody>
                <tfoot>
                    <tr>
                        <td colspan="50" class="p-4 border-t border-gray-100 bg-gray-50/50">
                            <button onclick="addEmptyProduct()" class="w-full bg-blue-50 border-2 border-blue-200 border-dashed text-blue-600 hover:bg-blue-100 hover:border-blue-300 py-3 rounded-xl font-bold transition duration-200 flex items-center justify-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                </svg>
                                إضافة سطر منتج جديد
                            </button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <div id="addProductTypeModal"
        class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg p-6 overflow-hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">إضافة نوع منتج</h2>
            <form id="addProductTypeForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">اسم النوع</label>
                    <input type="text" id="newTypeName" required
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">وصف النوع</label>
                    <textarea id="newTypeDescription" rows="3"
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="closeAddProductTypeModal()"
                        class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300">إلغاء</button>
                    <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700">إضافة
                        النوع</button>
                </div>
            </form>
        </div>
    </div>

    <div id="imagePreviewModal"
        class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4">
        <div class="relative bg-transparent rounded-xl max-w-4xl w-full">
            <button onclick="closeImageModal()"
                class="absolute top-4 left-4 bg-white rounded-full p-2 shadow-md text-gray-700 hover:bg-gray-100">X</button>
            <img id="modalPreviewImage" src="" alt="معاينة الصورة الكبيرة"
                class="w-full h-auto rounded-xl shadow-2xl object-contain max-h-[90vh] mx-auto">
        </div>
    </div>

    <!-- مودال خيارات الصورة المتقدمة للمنتج -->
    <div id="photoActionsModal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-96 max-w-full relative border border-gray-100 text-right">
            <button type="button" onclick="closePhotoActionsModal()"
                class="absolute top-4 left-4 text-gray-400 hover:text-gray-600 transition w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
            <h3 class="text-lg font-bold text-gray-800 text-center mb-6" id="photoActionsTitle">خيارات الملف</h3>

            <div class="space-y-4">
                <!-- خيار العرض أو التشغيل -->
                <button type="button" id="viewPhotoActionBtn"
                    class="w-full flex items-center justify-between p-4 rounded-xl border border-blue-100 bg-blue-50 hover:bg-blue-100 text-blue-900 font-semibold transition-all duration-200 group">
                    <svg class="w-5 h-5 text-blue-400 transform group-hover:translate-x-[-4px] transition-transform"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7">
                        </path>
                    </svg>
                    <span class="flex items-center gap-3">
                        <span class="p-2 rounded-lg bg-blue-500 text-white shadow-md shadow-blue-200">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                                </path>
                            </svg>
                        </span>
                        <span id="viewPhotoActionText">عرض الملف</span>
                    </span>
                </button>

                <!-- خيار الرفع/التغيير -->
                <button type="button" id="uploadPhotoActionBtn"
                    class="w-full flex items-center justify-between p-4 rounded-xl border border-green-100 bg-green-50 hover:bg-green-100 text-green-900 font-semibold transition-all duration-200 group">
                    <svg class="w-5 h-5 text-green-400 transform group-hover:translate-x-[-4px] transition-transform"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7">
                        </path>
                    </svg>
                    <span class="flex items-center gap-3">
                        <span class="p-2 rounded-lg bg-green-500 text-white shadow-md shadow-green-200">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                            </svg>
                        </span>
                        <span id="uploadPhotoActionText">رفع ملف جديد</span>
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- مودال معاينة الفيديو المخصص للتشغيل التفاعلي الفوري -->
    <div id="videoPreviewModal"
        class="hidden fixed inset-0 bg-black bg-opacity-80 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
        <div class="bg-gray-900 rounded-3xl overflow-hidden shadow-2xl w-full max-w-3xl relative border border-gray-800 flex flex-col">
            <button type="button" onclick="closeVideoPreviewModal()"
                class="absolute top-4 left-4 text-white hover:text-gray-300 transition w-10 h-10 flex items-center justify-center rounded-full bg-black bg-opacity-40 z-10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
            <div class="p-6 flex-1 flex flex-col items-center justify-center min-h-[300px]">
                <video id="modalPreviewVideo" controls class="w-full rounded-2xl shadow-lg border border-gray-800 max-h-[70vh] bg-black"></video>
            </div>
        </div>
    </div>

    <input type="file" id="hiddenPhotoSelectorInput" class="hidden" />
    <script src="products.js"></script>
</body>

</html>
