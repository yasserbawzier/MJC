<!-- doctype html: يخبر المتصفح أن هذا الملف HTML5 -->
<!DOCTYPE html>

<!-- html: العنصر الأساسي لكل الصفحة -->
<html lang="ar" dir="rtl">

<head>
    <!-- دعم العربية -->
    <meta charset="UTF-8">

    <!-- اسم الصفحة في التبويب -->
    <title>إدارة العمولات</title>

    <!-- مكتبة تنسيق الواجهة -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ملف CSS العام -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto">
        <div class="mb-4">
            <a href="index.html"
                class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 inline-block">العودة إلى
                الرئيسية</a>
        </div>
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">إدارة العمولات</h1>

            <button onclick="showManageCommissionsModal()"
                class="bg-blue-600 text-white px-6 py-2 rounded-xl shadow-md hover:bg-blue-700 hover:shadow-lg transition-all font-bold">
                إدارة العمولات / إضافة
            </button>
        </header>

        <!-- مساحة فارغة للإضافات المستقبلية -->
        <div
            class="bg-white rounded-xl shadow-sm border-2 border-dashed border-gray-300 p-12 flex items-center justify-center min-h-[400px]">
            <p class="text-gray-400 text-lg">سيتم بناء عناصر أخرى هنا لاحقاً...</p>
        </div>
    </div>

    <!-- مودال إدارة العمولات المجمع -->
    <div id="manageCommissionsModal"
        class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 overflow-hidden flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">نسب العمولات</h2>
                <button type="button" onclick="closeManageCommissionsModal()"
                    class="text-gray-400 hover:text-gray-800 transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <!-- نموذج الإضافة السريعة -->
            <form id="addCommissionForm" class="flex gap-3 mb-6 bg-gray-50 p-4 rounded-xl border border-gray-100">
                <div class="flex-1">
                    <label class="block text-xs font-semibold text-gray-500 mb-1">إضافة نسبة جديدة</label>
                    <input type="number" step="0.01" id="commissionRate" required placeholder="مثال: 0.05"
                        class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow">
                </div>
                <div class="flex items-end">
                    <button type="submit"
                        class="bg-green-600 text-white px-5 py-2.5 rounded-lg hover:bg-green-700 font-bold whitespace-nowrap shadow-sm hover:shadow transition-all flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4">
                            </path>
                        </svg>
                        إضافة
                    </button>
                </div>
            </form>

            <!-- قائمة العمولات -->
            <div class="overflow-y-auto flex-1 rounded-xl border border-gray-200">
                <table class="w-full text-right">
                    <thead class="bg-gray-100 sticky top-0 shadow-sm">
                        <tr>
                            <th class="p-3 text-gray-600 font-bold text-sm">النسبة المسجلة</th>
                            <th class="p-3 text-gray-600 font-bold text-sm text-left">حذف</th>
                        </tr>
                    </thead>
                    <tbody id="modalCommissionsList" class="divide-y divide-gray-100">
                        <!-- سيتم تعبئتها عبر الجافاسكريبت -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- app.js أولاً ثم منطق الصفحة -->
    <script src="App.js"></script>
    <script src="commissions.js"></script>
</body>

</html>
